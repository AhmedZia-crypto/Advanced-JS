<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Car Details</h1>

    <script>
        class vehicle{

            constructor(mileage , speed){
                this.mileage = mileage;
                this.speed = speed;
            }
        }

        let bmw = new vehicle(20, 50)
        document.write("The mileage is : " + bmw.mileage);
        document.write("<br>")
        document.write("The speed is : " + bmw.speed);
        
    </script>
</body>
</html>
